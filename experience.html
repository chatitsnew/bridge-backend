<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bridge — Skills-first hiring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F1EC;
  --paper-raised:#FAFAF7;
  --ink:#0C0D0B;
  --ink-soft:#4A4B46;
  --ink-faint:#8B8C84;
  --line:#D6D6CD;
  --gold:#C4571F;
  --gold-fill:#C4571F;
  --gold-soft:#F0DDCD;
  --teal:#2C6656;
  --teal-soft:#CFE3DA;
  --rust:#A6432F;
  --rust-soft:#EFD6CE;
  --shadow: none;
  --radius: 2px;
  --bg:#F1F1EC; --bg-raised:#FAFAF7; --accent:#C4571F;
}
:root:not([data-theme="light"]) {
  @media (prefers-color-scheme: dark){
    --paper:#0B0C0A; --paper-raised:#15160F; --ink:#F1F1EC; --ink-soft:#B7B8AF;
    --ink-faint:#7A7B73; --line:#2A2B24; --gold:#E07B3F; --gold-fill:#E07B3F;
    --gold-soft:#3A2A1C; --teal:#65B79B; --teal-soft:#1D332C; --rust:#DE8A72; --rust-soft:#3A2521;
    --bg:#0B0C0A; --bg-raised:#15160F; --accent:#E07B3F;
  }
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.01ms !important; scroll-behavior:auto !important;
  }
}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  line-height:1.5; min-height:100vh;
}
.grid-bg{
  position:fixed; inset:0; z-index:-1; pointer-events:none;
  background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size:64px 64px; opacity:.3;
  mask-image:linear-gradient(to bottom, black, transparent 65%);
}
.reveal{ opacity:0; transform:translateY(22px); transition:opacity .55s cubic-bezier(.16,1,.3,1), transform .55s cubic-bezier(.16,1,.3,1); }
.reveal.in-view{opacity:1; transform:translateY(0);}
h1,h2,h3,.serif{ font-family:"Fraunces", Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif; font-weight:500; letter-spacing:-0.01em; margin:0; }
.mono{ font-family:ui-monospace, SFMono-Regular, "SF Mono", Consolas, "Liberation Mono", monospace; }
.wrap{max-width:1180px;margin:0 auto;padding:0 28px 80px;}

/* ---------- Hero (from marketing page) ---------- */
.badge-row{display:flex; align-items:center; gap:10px; margin-bottom:26px;}
.badge{ display:inline-flex; align-items:center; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); border:1px solid var(--line); border-radius:20px; padding:6px 14px; background:var(--paper-raised); }
.badge-connector{width:26px; height:1px; background:var(--line);}
.hero-grid{display:grid; grid-template-columns:1.15fr .85fr; gap:40px; align-items:center; margin-top:20px;}
@media (max-width:900px){ .hero-grid{grid-template-columns:1fr;} }
.hero-grid h1{font-size:clamp(34px,4.6vw,52px); line-height:1.08;}
.hero-grid .tagline{ max-width:56ch; color:var(--ink-soft); font-size:16.5px; margin-top:20px; }
.hero-cta{margin-top:30px; display:flex; gap:14px; flex-wrap:wrap; align-items:center;}

/* ---------- Header ---------- */
header{ padding:44px 0 30px; border-bottom:1px solid var(--line); }
.brand-row{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;}
header h1{font-size:clamp(32px,5vw,44px); color:var(--ink);}
.dot{color:var(--gold);}
.tagline{ max-width:56ch; color:var(--ink-soft); font-size:16px; margin-top:10px; }
.header-meta{ margin-top:18px; display:flex; gap:22px; flex-wrap:wrap; font-size:13px; color:var(--ink-faint); }
.header-meta span b{color:var(--ink-soft); font-weight:500;}

.module-tag{
  font-size:11px; color:var(--ink-faint); letter-spacing:.07em; text-transform:uppercase;
  margin:26px 0 10px; display:flex; align-items:center; gap:10px;
}
.module-tag::before{content:""; width:22px; height:1px; background:var(--line); flex-shrink:0;}
.module-tag b{color:var(--ink-soft); font-weight:600;}

.clear-link{ background:none; border:none; color:var(--ink-faint); font-size:12px; text-decoration:underline; text-underline-offset:2px; cursor:pointer; padding:0; font-family:inherit; }
.clear-link:hover{color:var(--ink);}
.persona-head-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px;}

.workbench{ display:grid; grid-template-columns:minmax(280px, 380px) 1fr; gap:0; margin-top:0; border-bottom:1px solid var(--line); }
@media (max-width:860px){ .workbench{grid-template-columns:1fr;} }
.panel{padding:34px 30px;}
.panel + .panel{border-left:1px solid var(--line);}
@media (max-width:860px){ .panel + .panel{border-left:none; border-top:1px solid var(--line);} }

.panel-label{ font-size:12px; color:var(--ink-faint); margin-bottom:16px; display:flex; align-items:center; gap:8px; }
.panel-label::after{ content:""; flex:1; height:1px; background:var(--line); }

.persona-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
.persona-chip{
  border:1px solid var(--line); background:var(--paper-raised); color:var(--ink-soft);
  padding:7px 13px; border-radius:var(--radius); font-size:13px; font-family:inherit; cursor:pointer;
  transition:border-color .15s, color .15s, transform .18s cubic-bezier(.34,1.56,.64,1), background .15s;
}
.persona-chip:hover{border-color:var(--gold); transform:translateY(-1px);}
.persona-chip.active{ border-color:var(--gold); color:var(--ink); background:var(--gold-soft); font-weight:500; transform:scale(1.04); }

textarea{
  width:100%; min-height:172px; resize:vertical; background:var(--paper-raised); border:1px solid var(--line);
  border-radius:var(--radius); color:var(--ink); font-family:inherit; font-size:14px; line-height:1.55; padding:12px 13px;
}
textarea:focus, input:focus, button:focus-visible{ outline:2px solid var(--gold); outline-offset:1px; }

.field-row{display:flex; gap:16px; margin-top:16px; flex-wrap:wrap;}
.field{display:flex; flex-direction:column; gap:6px; font-size:13px; color:var(--ink-soft);}
.field input[type="number"]{ width:84px; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); padding:7px 9px; color:var(--ink); font-family:inherit; font-size:14px; }
.field input[type="text"]{ width:100%; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); padding:7px 9px; color:var(--ink); font-family:inherit; font-size:14px; box-sizing:border-box; }
.architect-note{font-size:12px; color:var(--ink-faint); margin:10px 0 16px; line-height:1.5;}
.verify-block{ margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:12.5px; color:var(--ink-soft); line-height:1.5; }
.verify-block b{color:var(--ink);}
.ats-block{ margin-top:8px; padding:10px 12px; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); font-size:12.5px; color:var(--ink-soft); line-height:1.5; }
.ats-block .ats-line{font-family:Georgia,serif; color:var(--ink); font-style:italic;}
.check-field{ display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-soft); cursor:pointer; margin-top:16px; }
.check-field input{accent-color:var(--gold);}

.analyze-btn{
  margin-top:22px; width:100%; padding:13px; background:var(--ink); color:var(--paper); border:none;
  border-radius:var(--radius); font-family:inherit; font-size:14.5px; font-weight:500; cursor:pointer;
  transition:opacity .15s, transform .15s cubic-bezier(.34,1.56,.64,1);
}
.analyze-btn:hover{opacity:.85;}
.analyze-btn:active{transform:scale(.98);}

.btn-primary{
  padding:9px 18px; background:var(--ink); color:var(--paper); border:none; border-radius:var(--radius);
  font-family:inherit; font-size:13.5px; font-weight:500; cursor:pointer;
  transition:opacity .15s, transform .15s cubic-bezier(.34,1.56,.64,1); white-space:nowrap;
}
.btn-primary:hover{opacity:.85;}
.btn-primary:active{transform:scale(.97);}
.btn-primary:disabled{opacity:.5; cursor:default;}

.note{font-size:12px; color:var(--ink-faint); margin-top:10px; line-height:1.5;}

.graph-head{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:6px;}
.legend{display:flex; gap:16px; font-size:12px; color:var(--ink-faint); flex-wrap:wrap;}
.legend span{display:flex; align-items:center; gap:6px;}
.legend i{width:10px; height:10px; border-radius:50%; display:inline-block;}
.legend .dot-explicit{background:var(--gold-fill);}
.legend .dot-inferred{background:transparent; border:1.5px dashed var(--gold);}
.legend .dot-gap{background:var(--rust-soft); border:1.3px dashed var(--rust);}

.gap-select-row{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin:14px 0 4px; font-size:13px; color:var(--ink-soft); }
.gap-select-row select{ background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); padding:6px 9px; color:var(--ink); font-family:inherit; font-size:13px; }
#gap-summary{font-size:12px; color:var(--rust);}

#graph-svg{width:100%; height:380px; display:block;}
@media (max-width:860px){ #graph-svg{ width:100vw; max-width:100vw; position:relative; left:50%; right:50%; margin-left:-50vw; margin-right:-50vw; } }
.node-label{ font-family:inherit; font-size:11px; fill:var(--ink-soft); pointer-events:none; }
.link-line{stroke:var(--line); stroke-width:1.3;}
.node-circle{cursor:pointer;}

#rationale{ margin-top:10px; min-height:44px; padding:12px 14px; background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius); font-size:13px; color:var(--ink-soft); }
#rationale b{color:var(--ink); font-weight:600;}
#rationale .empty{color:var(--ink-faint); font-style:italic;}

.results-head{padding:38px 0 10px;}
.results-head h2{font-size:26px;}
.results-sub{color:var(--ink-soft); font-size:14.5px; margin-top:8px; max-width:70ch;}

.stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--line); border:1px solid var(--line); margin:26px 0 34px; }
@media (max-width:600px){ .stat-row{grid-template-columns:1fr;} }
.stat{background:var(--paper); padding:22px 22px 20px;}
.stat .num{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua",serif; font-size:44px; font-weight:600; line-height:1;}
.stat .num.rust{color:var(--rust);} .stat .num.teal{color:var(--teal);} .stat .num.gold{color:var(--gold);}
.stat .cap{font-size:13px; color:var(--ink-soft); margin-top:8px; max-width:32ch;}

.job-row{
  border-bottom:1px solid var(--line); padding:22px 0; display:grid; grid-template-columns:26px 1.5fr 1fr; gap:22px; align-items:start;
  opacity:1; transform:translateY(0); transition:opacity .5s cubic-bezier(.16,1,.3,1), transform .5s cubic-bezier(.16,1,.3,1);
}
@starting-style{ .job-row{ opacity:0; transform:translateY(16px); } }
@media (max-width:760px){ .job-row{grid-template-columns:1fr; gap:10px;} .job-rank{display:none;} }
.job-rank{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua",serif; color:var(--ink-faint); font-size:18px; padding-top:2px;}
.job-title{font-size:16.5px; font-weight:600; font-family:Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua",serif;}
.job-meta{font-size:12.5px; color:var(--ink-faint); margin-top:4px;}
.job-desc{font-size:13px; color:var(--ink-soft); margin-top:10px; max-width:62ch; line-height:1.6;}
.job-desc mark{background:var(--rust-soft); color:var(--rust); padding:0 3px; border-radius:2px; font-weight:500;}

.verdict-block{margin-bottom:12px;}
.verdict-label{font-size:11.5px; color:var(--ink-faint); margin-bottom:5px;}
.verdict-badge{
  display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; padding:4px 10px 4px 8px; border-radius:20px;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1), opacity .4s ease;
}
@starting-style{ .verdict-badge{ opacity:0; transform:scale(.82); } }
.verdict-badge.pass{color:var(--teal); background:var(--teal-soft);}
.verdict-badge.reject{color:var(--rust); background:var(--rust-soft);}
.verdict-badge .icon{font-size:12px;}

@keyframes pulse-ring{ 0%,100%{ stroke-opacity:1; } 50%{ stroke-opacity:.35; } }
.inferred-node{ animation: pulse-ring 2.4s ease-in-out infinite; }
.verdict-reasons{font-size:12px; color:var(--ink-faint); margin-top:4px; line-height:1.55;}

.bar-track{ height:8px; background:var(--paper-raised); border:1px solid var(--line); border-radius:20px; overflow:hidden; margin-top:6px; position:relative; }
.bar-fill{height:100%; background:var(--teal); transition:width .8s cubic-bezier(.16,1,.3,1);}
@starting-style{ .bar-fill{ width:0% !important; } }
.bar-fill.low{background:var(--ink-faint);}
.bar-pct{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua",serif; font-size:19px; font-weight:600;}

.breakdown-toggle{ background:none; border:none; color:var(--ink-soft); font-size:12px; text-decoration:underline; text-underline-offset:2px; cursor:pointer; padding:0; margin-top:10px; font-family:inherit; }
.breakdown-toggle:hover{color:var(--ink);}
.breakdown-panel{
  max-height:0; overflow:hidden; opacity:0; margin-top:0; padding:0 13px; background:var(--paper-raised); border:1px solid transparent; border-radius:var(--radius);
  transition:max-height .4s cubic-bezier(.16,1,.3,1), opacity .3s ease, margin-top .4s cubic-bezier(.16,1,.3,1), padding .4s cubic-bezier(.16,1,.3,1), border-color .3s ease;
}
.breakdown-panel.open{ max-height:900px; opacity:1; margin-top:10px; padding:11px 13px; border-color:var(--line); }
.breakdown-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid var(--line); font-size:12.5px; flex-wrap:wrap; }
.breakdown-row:last-child{border-bottom:none;}
.breakdown-row .sk-name{color:var(--ink);}
.breakdown-row .req-tag{font-size:10.5px; color:var(--ink-faint); margin-left:5px;}
.breakdown-right{display:flex; align-items:center; gap:8px;}
.sk-tag{font-size:11px; padding:2px 8px; border-radius:20px; white-space:nowrap;}
.sk-tag.explicit{background:var(--gold-soft); color:var(--gold);}
.sk-tag.inferred{background:var(--paper); color:var(--gold); border:1px dashed var(--gold);}
.sk-tag.missing{background:var(--rust-soft); color:var(--rust);}
.sk-pts{font-size:11px; color:var(--ink-faint); min-width:44px; text-align:right;}

.ghost-panel{border:1px solid var(--line); margin:20px 0 12px;}
.ghost-grid{display:grid; grid-template-columns:1fr auto 1fr;}
@media (max-width:760px){ .ghost-grid{grid-template-columns:1fr;} .ghost-divider{width:auto !important; height:1px;} }
.ghost-card{padding:24px;}
.ghost-card .id-eyebrow{font-size:11px; color:var(--ink-faint); margin-bottom:12px;}
.ghost-card .id-row{font-size:14.5px; margin-bottom:7px; color:var(--ink-soft);}
.ghost-card .id-row b{color:var(--ink); font-weight:600;}
.ghost-divider{width:1px; background:var(--line);}
.ghost-center{ padding:24px; text-align:center; display:flex; flex-direction:column; justify-content:center; align-items:center; background:var(--teal-soft); min-width:170px; }
.ghost-center .ghost-num{font-family:Georgia,"Iowan Old Style","Palatino Linotype","Book Antiqua",serif; font-size:36px; font-weight:600; color:var(--teal); line-height:1;}
.ghost-center .ghost-cap{font-size:11.5px; color:var(--ink-soft); margin-top:9px; max-width:24ch; line-height:1.5;}
.ghost-note{padding:16px 24px; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink-faint); line-height:1.6;}
.ghost-note b{color:var(--ink-soft);}
.ghost-empty{padding:24px; font-size:13.5px; color:var(--ink-faint);}

footer{ margin-top:44px; padding-top:22px; border-top:1px solid var(--line); font-size:12.5px; color:var(--ink-faint); line-height:1.7; max-width:78ch; }
footer b{color:var(--ink-soft);}

</style>

/* ============ Backend wiring ============

   backend first, falls back to the local engine if unreachable. */
const BACKEND_URL = 'https://bridge-here-for-food.up.railway.app';
async function fetchFromBackend(text, years, hasDegree, hadGap) {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 1500);
    try {
        const res = await fetch(BACKEND_URL + '/api/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, years, hasDegree, hadGap }),
            signal: controller.signal
        });
        clearTimeout(timeout);
        if (!res.ok)
            return null;
        const data = await res.json();
        const explicit = new Set(data.explicitSkills.map((name) => byName[name.toLowerCase()]).filter(Boolean));
        const inferred = new Map();
        data.inferredSkills.forEach((s) => {
            const id = byName[s.name.toLowerCase()];
            const fromId = byName[(s.inferredFrom || '').toLowerCase()];
            if (id)
                inferred.set(id, { confidence: s.confidence, from: fromId });
        });
        return { explicit, inferred };
    }
    catch (e) {
        clearTimeout(timeout);
        return null;
    }
}
async function analyzeCandidate(text, years, hasDegree, hadGap) {
    const backendResult = await fetchFromBackend(text, years, hasDegree, hadGap);
    if (backendResult) {

    }
    const explicit = extractExplicit(text);
    const inferred = inferSkills(explicit);
    return { explicit, inferred, live: false };
}

    const res = await fetch(BACKEND_URL + '/api/learning-pathway', {

        body: JSON.stringify({ text, years, hasDegree, hadGap, jobName })
    });

}

    const res = await fetch(BACKEND_URL + '/api/fairness-summary');

}
